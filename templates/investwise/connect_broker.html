{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Broker - InvestWise AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-xl border border-gray-200">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 bg-purple-700 text-white font-bold rounded-2xl flex items-center justify-center text-xl">
                🔗
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900">Broker Setup</h1>
                <p class="text-sm text-gray-500">Logged in as {{ user.email }}</p>
            </div>
        </div>

        <form method="POST" action="{% url 'connect_broker' %}" class="flex flex-col gap-4">
            {% csrf_token %}
            
            <!-- Broker Selection Dropdown -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Select Your Broker</label>
                <select name="broker_name" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 bg-white appearance-none cursor-pointer">
                    <option value="ANGELONE" {% if creds.broker_name == 'ANGELONE' %}selected{% endif %}>📈 Angel One</option>
                    <option value="ZERODHA" {% if creds.broker_name == 'ZERODHA' %}selected{% endif %}>🪁 Zerodha Kite</option>
                    <option value="UPSTOX" {% if creds.broker_name == 'UPSTOX' %}selected{% endif %}>🟣 Upstox</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">API Key</label>
                <input type="text" name="api_key" value="{{ creds.api_key|default:'' }}" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Client ID</label>
                <input type="text" name="client_id" value="{{ creds.client_id|default:'' }}" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">PIN / Password</label>
                <input type="password" name="pin" value="{{ creds.pin|default:'' }}" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">TOTP Secret Key</label>
                <input type="text" name="totp_secret" value="{{ creds.totp_secret|default:'' }}" required
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>

            <button type="submit" 
                    class="mt-4 w-full bg-purple-700 text-white py-3.5 rounded-xl font-bold hover:bg-purple-800 transition-colors shadow-lg">
                Save & Link Portfolio
            </button>
            
            <a href="{% url 'dashboard' %}" class="text-center text-sm text-gray-500 hover:underline">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
