version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: investwise_postgres
    environment:
      POSTGRES_DB: investwise_db
      POSTGRES_USER: investwise_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investwise_user -d investwise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: investwise_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-production-secure-key-change-in-prod}
      - DEBUG=False
      - DATABASE_URL=postgres://investwise_user:${POSTGRES_PASSWORD:-secretpassword123}@postgres:5432/investwise_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/AI/models

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_celery_worker
    command: celery -A config worker --loglevel=info -c 4
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-production-secure-key-change-in-prod}
      - DATABASE_URL=postgres://investwise_user:${POSTGRES_PASSWORD:-secretpassword123}@postgres:5432/investwise_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=django-db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
    volumes:
      - ./models:/app/AI/models

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_celery_beat
    command: celery -A config beat --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-production-secure-key-change-in-prod}
      - DATABASE_URL=postgres://investwise_user:${POSTGRES_PASSWORD:-secretpassword123}@postgres:5432/investwise_db
      - CELERY_BROKER_URL=redis://redis:6379/0

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: investwise_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
