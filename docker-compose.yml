version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: investwise_postgres
    environment:
      POSTGRES_DB: investwise_db
      POSTGRES_USER: investwise_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investwise_user -d investwise_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - investwise_network

  redis:
    image: redis:7-alpine
    container_name: investwise_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_here}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - investwise_network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    volumes:
      - ./backend:/app/backend
      - ./AI:/app/AI
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ENCRYPTION_KEY=${DJANGO_ENCRYPTION_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=investwise_db
      - DB_USER=investwise_user
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_here}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
      - FMP_API_KEY=${FMP_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEC_EDGAR_USER_AGENT=${SEC_EDGAR_USER_AGENT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - investwise_network
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_celery
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app/backend
      - ./AI:/app/AI
      - ./logs:/app/logs
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=investwise_db
      - DB_USER=investwise_user
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_here}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
      - FMP_API_KEY=${FMP_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - investwise_network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: investwise_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    environment:
      - DJANGO_ENV=production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=investwise_db
      - DB_USER=investwise_user
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_here}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password_here}@redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - investwise_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: investwise_frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - investwise_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: investwise_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/var/www/static
      - ./frontend/dist:/var/www/html
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates here
    depends_on:
      - backend
      - frontend
    networks:
      - investwise_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  investwise_network:
    driver: bridge