# =============================================================================
# InvestWise AI - NGINX Production Configuration
# Responsibilities: SSL, Reverse Proxy, Static Files, Compression,
#                  Caching, Rate Limiting, Load Balancing
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ------------------------------------------------------------------
    # Basic Settings
    # ------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ------------------------------------------------------------------
    # Logging Format
    # ------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'uct=$upstream_connect_time uht=$upstream_header_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ------------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-javascript
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ------------------------------------------------------------------
    # Rate Limiting Zones
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ------------------------------------------------------------------
    # Connection and Timeout Limits
    # ------------------------------------------------------------------
    limit_conn conn_limit 20;
    limit_req_status 429;
    limit_conn_status 429;

    # ------------------------------------------------------------------
    # Cache Zones
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2
        keys_zone=api_cache:10m max_size=500m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static_cache levels=1:2
        keys_zone=static_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # ------------------------------------------------------------------
    # Upstream Definitions (Load Balancing)
    # ------------------------------------------------------------------
    upstream backend_cluster {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        # Additional backend instances can be added here for horizontal scaling:
        # server backend2:8000 max_fails=3 fail_timeout=30s;
        # server backend3:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_cluster {
        least_conn;
        server ai:8001 max_fails=3 fail_timeout=30s;
        # Additional AI instances can be added here for horizontal scaling:
        # server ai2:8001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream websocket_cluster {
        ip_hash;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ------------------------------------------------------------------
    # SSL Configuration
    # ------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # ------------------------------------------------------------------
    # HTTP -> HTTPS Redirect
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Main HTTPS Server
    # ------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (mount via docker-compose)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ------------------------------------------------------------------
        # Frontend Static Files (React SPA)
        # ------------------------------------------------------------------
        root /var/www/html;
        index index.html;

        # Serve frontend SPA with fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ------------------------------------------------------------------
        # Django Static Files
        # ------------------------------------------------------------------
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ------------------------------------------------------------------
        # API Endpoints (Django REST Backend)
        # ------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Proxy caching for GET requests
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            add_header X-Cache-Status $upstream_cache_status;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Authentication Endpoints (Stricter Rate Limiting)
        # ------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # No caching for auth endpoints
            proxy_no_cache 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------------------------------
        # AI Endpoints (Lower Rate Limit, Higher Timeout)
        # ------------------------------------------------------------------
        location /api/ai/ {
            limit_req zone=ai burst=5 nodelay;

            proxy_pass http://ai_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # No caching for AI endpoints (dynamic predictions)
            proxy_no_cache 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";

            # Higher timeouts for AI inference
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ------------------------------------------------------------------
        # WebSocket Endpoints
        # ------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://websocket_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ------------------------------------------------------------------
        # Health Check Endpoint (No Rate Limiting)
        # ------------------------------------------------------------------
        location /api/health/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            access_log off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ------------------------------------------------------------------
        # Django Admin
        # ------------------------------------------------------------------
        location /admin/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ------------------------------------------------------------------
        # Block sensitive files
        # ------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ------------------------------------------------------------------
        # Custom error pages
        # ------------------------------------------------------------------
        error_page 429 = @rate_limit;
        error_page 502 503 504 = @service_unavailable;

        location @rate_limit {
            default_type application/json;
            return 429 '{"error": "Rate limit exceeded", "message": "Too many requests. Please try again later."}';
        }

        location @service_unavailable {
            default_type application/json;
            return 503 '{"error": "Service unavailable", "message": "The service is temporarily unavailable. Please try again later."}';
        }
    }
}