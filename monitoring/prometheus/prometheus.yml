# =============================================================================
# InvestWise AI - Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load alert rules
rule_files:
  - alert_rules.yml

# Scrape configurations
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------------------------------------------------------------------
  # Node Exporter - System Metrics (CPU, Memory, Disk, Network)
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

  # ---------------------------------------------------------------------------
  # Backend - Django REST API Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000', 'backend2:8000']
        labels:
          service: 'django-backend'
    metrics_path: '/api/metrics/'
    scrape_interval: 10s

  # ---------------------------------------------------------------------------
  # AI Service Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai:8001']
        labels:
          service: 'ai-inference'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter - Database Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
    scrape_interval: 30s

  # ---------------------------------------------------------------------------
  # Redis Exporter - Cache Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # Celery Flower - Task Queue Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'celery-flower'
    static_configs:
      - targets: ['flower:5555']
        labels:
          service: 'celery'
    metrics_path: '/flower/metrics'
    scrape_interval: 15s

  # ---------------------------------------------------------------------------
  # NGINX Exporter - Reverse Proxy Metrics
  # ---------------------------------------------------------------------------
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
    scrape_interval: 15s